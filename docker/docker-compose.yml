services:
  # MQTT broker for the VDA 5050 interface
  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports: ["1883:1883"]

  # Robot stack in simulation
  amr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    depends_on: [mqtt]
