ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    # Frames: the EKF publishes odom -> base_footprint
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Sensor config order: x y z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az
    # Wheel odometry contributes forward, lateral and yaw velocity
    odom0: /diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # IMU contributes yaw rate only
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
