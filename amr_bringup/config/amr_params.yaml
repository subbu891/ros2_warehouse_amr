safety_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame: base_link
    rate: 20.0
    cmd_timeout: 0.5

    # Robot footprint and field width
    footprint_front: 0.30
    footprint_rear: 0.30
    footprint_half_width: 0.225
    lateral_margin: 0.10

    # Stopping model: reaction time and guaranteed deceleration
    t_response: 0.15
    a_brake: 1.0
    protective_margin: 0.10

    # Warning field and speed reduction
    t_warning: 1.0
    warning_margin: 0.30
    min_speed_scale: 0.2

    # Rotation field, restart delay and lidar watchdog
    rotation_margin: 0.08
    release_delay: 1.0
    sensor_timeout: 0.5

obstacle_tracker:
  ros__parameters:
    use_sim_time: true
    map_frame: map

    # Static map filter and clustering
    static_dilation: 0.20
    cluster_gap: 0.3
    min_cluster_points: 3
    max_range: 8.0

    # Tracking: association gate, alpha-beta gains, confirmation and expiry
    gate: 1.0
    alpha: 0.5
    beta: 0.3
    confirm_hits: 3
    max_age: 1.0

    # Prediction of moving tracks
    moving_speed: 0.15
    horizon: 2.0
    horizon_step: 0.25

mission_executor:
  ros__parameters:
    use_sim_time: true

    # Retries per step, timeout per step and the dock plugin used for undocking
    max_attempts: 3
    step_timeout: 180.0
    dock_type: simple_charging_dock

vda5050_adapter:
  ros__parameters:
    use_sim_time: true

    # Vehicle identity and MQTT broker
    manufacturer: TUM-Student
    serial_number: amr_001
    broker_host: localhost
    broker_port: 1883

    # Topic layout uagv/v2/<manufacturer>/<serial>/<topic>
    interface_name: uagv
    major_version: v2

    # State publishing and simulated battery
    state_period: 1.0
    map_id: warehouse
    initial_battery: 90.0

forklift_mover:
  ros__parameters:
    use_sim_time: true
    speed: 0.5
    min_y: 1.5
    max_y: 9.0
